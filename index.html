/* ============================================================
   CONFIG / STORAGE
   ============================================================ */
const STORAGE_KEY = 'fos_hud_api_url';
const MOCK_KEY = 'fos_hud_mock_mode';
// Pre-filled with your deployed Apps Script Web App URL — used the first time
// this page loads on a device, before anything has been saved to localStorage.
// Change this if you redeploy to a new /exec URL, or just update it once from
// the in-app Settings modal (gear icon) and it'll persist from then on.
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbyjIoOr0-s-QL-5tFa65mdNu6L12CHyTDVPV8NwYXMOkoVqGLS81LiL_3burFOHsfO3/exec';

function getStoredUrl() {
  try { return localStorage.getItem(STORAGE_KEY) || DEFAULT_API_URL; } catch (e) { return DEFAULT_API_URL; }
}
function setStoredUrl(url) {
  try { localStorage.setItem(STORAGE_KEY, url); } catch (e) {}
}
function getMockMode() {
  try { return localStorage.getItem(MOCK_KEY) === '1'; } catch (e) { return false; }
}
function setMockMode(v) {
  try { localStorage.setItem(MOCK_KEY, v ? '1' : '0'); } catch (e) {}

/* ============================================================
   API
   ============================================================ */
function useApi() {
  const [apiUrl, setApiUrl] = useState(getStoredUrl());
  const [mock, setMock] = useState(getMockMode());

  const callApi = useCallback(async (action, payload) => {
    if (mock || !apiUrl) {
      await new Promise(r => setTimeout(r, 350));
      if (action === 'getAdminWorkingHours') return { ok: true, rows: MOCK.hours };
      if (action === 'getAdminVisitsCompleted') return { ok: true, rows: MOCK.visits };
      if (action === 'getAdminVisitSummary') return { ok: true, sections: MOCK.sections };
      if (action === 'getAdminAttendance') return { ok: true, ...MOCK.attendance };
      if (action === 'submitAdminAttendance') return { ok: true, count: (payload && payload.records || []).length };
      if (action === 'getAdminBeatPlan') return { ok: true, rows: MOCK.beatplan };
      return { ok: false, message: 'Unknown mock action' };
    }
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload: payload || {} }),
    });
    return res.json();
  }, [apiUrl, mock]);

  const updateApiUrl = useCallback((url) => {
    setApiUrl(url);
    setStoredUrl(url);
  }, []);
  const updateMock = useCallback((v) => {
    setMock(v);
    setMockMode(v);
  }, []);

  return { apiUrl, updateApiUrl, mock, updateMock, callApi };
}

/* ============================================================
   1. WORKING HOURS SCREEN
   ============================================================ */
function initials(name) {
  const parts = String(name).trim().split(/\s+/);
  const a = (parts[0] || '')[0] || '';
  const b = (parts[1] || '')[0] || '';
  return (a + b).toUpperCase() || '--';
}

function WorkingHoursScreen({ rows, loading, attendanceMap }) {
  const [query, setQuery] = useState('');

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return rows;
    return rows.filter(r => r.name.toLowerCase().includes(q));
  }, [rows, query]);

  const stats = useMemo(() => {
    const onLeave = rows.filter(r => attendanceMap[r.name] === 'L').length;
    const active = rows.filter(r => attendanceMap[r.name] !== 'L' && r.start !== '--' && r.end === '--').length;
    const completed = rows.filter(r => attendanceMap[r.name] !== 'L' && r.start !== '--' && r.end !== '--').length;
    return { active, completed, onLeave };
  }, [rows, attendanceMap]);

  return (
    <div className="px-4 py-4 max-w-2xl mx-auto">
      <div className="flex gap-2 mb-4">
        <StatChip label="ACTIVE IN FIELD" value={stats.active} tone="mint" />
        <StatChip label="COMPLETED SHIFT" value={stats.completed} tone="cyan" />
        <StatChip label="ON LEAVE" value={stats.onLeave} tone="amber" />
      </div>

      <div className="relative mb-4">
        <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#4A5A70]" />
        <input
          value={query}
          onChange={e => setQuery(e.target.value)}
          placeholder="Filter officers by name..."
          className="w-full bg-elevated/70 border border-[#8CAAC8]/15 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-[#4A5A70] focus:border-cyan/40 outline-none transition-colors"
        />
      </div>

      {loading ? (
        <SkeletonList rows={4} tall />
      ) : filtered.length === 0 ? (
        <EmptyState text="No officers match that search." />
      ) : (
        <div className="space-y-3">
          {filtered.map((r, i) => {
            const onLeave = attendanceMap[r.name] === 'L';
            return (
              <motion.div
                key={r.name + i}
                initial={{ opacity: 0, y: 6 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ delay: i * 0.03 }}
                whileHover={{ y: -2 }}
                className="group"
              >
                <GlassCard className="px-4 py-3.5 border-[#8CAAC8]/15 group-hover:border-cyan/30 transition-colors">
                  <div className="flex items-center justify-between gap-3 mb-3">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <div className="w-8 h-8 rounded-full bg-cyan/10 border border-cyan/30 flex items-center justify-center shrink-0">
                        <span className="text-[11px] font-display font-bold text-cyan">{initials(r.name)}</span>
                      </div>
                      <span className="text-sm font-medium text-white truncate">{r.name}</span>
                    </div>
                    <span className={`shrink-0 text-[10px] font-display font-semibold tracking-wider px-2.5 py-1 rounded-full border ${onLeave ? 'text-amber border-amber/30 bg-amber/10' : 'text-cyan border-cyan/30 bg-cyan/10'}`}>
                      {onLeave ? 'ON LEAVE' : 'LOGGED'}
                    </span>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <HourTile label="START" value={onLeave ? '--:--' : r.start} tone="cyan" />
                    <HourTile label="END" value={onLeave ? '--:--' : r.end} tone="white" />
                    <HourTile label="TOTAL" value={onLeave ? 'On Leave' : r.total} tone="mint" />
                  </div>
                </GlassCard>
              </motion.div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function HourTile({ label, value, tone }) {
  const toneMap = { cyan: 'text-cyan', mint: 'text-mint', white: 'text-white' };
  return (
    <div className="rounded-lg bg-elevated/70 border border-[#8CAAC8]/15 px-2 py-2 text-center">
      <div className="text-[8px] font-display tracking-wider text-[#7C93AC] mb-1">{label}</div>
      <div className={`font-mono tabular text-[13px] font-semibold truncate ${toneMap[tone]}`}>{value}</div>
    </div>
  );
}

/* ============================================================
   2. VISITS COMPLETED SCREEN
   ============================================================ */
function VisitsScreen({ rows, loading }) {
  return (
    <div className="px-4 py-4 max-w-2xl mx-auto">
      {loading ? (
        <SkeletonList rows={4} tall />
      ) : rows.length === 0 ? (
        <EmptyState text="No visit data found." />
      ) : (
        <div className="space-y-3">
          {rows.map((r, i) => {
            // No target field exists — the historical average is only used as a
            // reference point to flag whether today's count is above or below it.
            const avgInt = 15;
            const tgt = Math.round(r.avg)
            const reference = avgInt > 0 ? avgInt : Math.max(r.today, 1);
            const delta = r.today - reference;
            const aboveAvg = delta >= 0;
            const pct = reference > 0 ? Math.round((r.today / reference) * 100) : 0;
            const barPct = Math.min(100, pct);
            return (
              <motion.div
                key={r.name + i}
                initial={{ opacity: 0, y: 6 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ delay: i * 0.03 }}
              >
                <GlassCard className="px-4 py-3.5">
                  <div className="flex items-start justify-between gap-2 mb-1">
                    <div className="min-w-0">
                      <div className="text-sm font-medium text-white truncate">{r.name}</div>
                    </div>
                    <span className={`shrink-0 flex items-center gap-1 text-[10px] font-display font-semibold tracking-wide px-2 py-1 rounded-full border ${aboveAvg ? 'text-mint border-mint/30 bg-mint/10' : 'text-[#A56BFF] border-[#A56BFF]/30 bg-[#A56BFF]/10'}`}>
                      {aboveAvg ? '↑' : '↓'} {aboveAvg ? '+' : ''}{delta} {aboveAvg ? 'Above Tgt' : 'Below Tgt'}
                    </span>
                  </div>

                  <div className="h-2 rounded-full bg-elevated overflow-hidden my-3">
                    <motion.div
                      initial={{ width: 0 }}
                      animate={{ width: `${barPct}%` }}
                      transition={{ duration: 0.7, delay: i * 0.05, ease: 'easeOut' }}
                      className={`h-full rounded-full ${aboveAvg ? 'bg-gradient-to-r from-cyan to-mint shadow-glow-mint' : 'bg-[#A56BFF] shadow-[0_0_15px_rgba(165,107,255,0.25)]'}`}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <HourTile label="TODAY" value={r.today} tone="cyan" />
                    <HourTile label="HISTORICAL AVG" value={tgt} tone="white" />
                  </div>
                </GlassCard>
              </motion.div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function SummaryScreen({ sections, loading }) {
  // Team Summary always leads, followed by each individual MO/Officer section
  // in whatever order the backend returned them.
  const ordered = useMemo(() => {
    const team = sections.filter(s => s.title === 'Team Summary');
    const rest = sections.filter(s => s.title !== 'Team Summary');
    return [...team, ...rest];
  }, [sections]);

  // Accordion: only one section open at a time. Team Summary opens by default.
  // Picked synchronously from the initial data (not a post-mount effect) so
  // landing on this tab doesn't trigger an extra open/height-animate reflow
  // right as a swipe gesture might be starting.
  const [expandedTitle, setExpandedTitle] = useState(() => (ordered.length > 0 ? ordered[0].title : null));
  useEffect(() => {
    if (ordered.length > 0 && expandedTitle === null) setExpandedTitle(ordered[0].title);
  }, [ordered]); // eslint-disable-line

  return (
    <div className="px-4 py-4 max-w-2xl mx-auto space-y-3">
      {loading ? (
        <SkeletonList rows={3} tall />
      ) : ordered.length === 0 ? (
        <EmptyState text="No summary data found." />
      ) : (
        ordered.map((sec, si) => {
          const isOpen = expandedTitle === sec.title;
          return (
            <motion.div key={sec.title + si} initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: si * 0.05 }}>
              <GlassCard>
                <button
                  onClick={() => setExpandedTitle(isOpen ? null : sec.title)}
                  className="w-full px-4 py-2.5 border-b border-[#8CAAC8]/15 flex items-center justify-between gap-2 text-left"
                >
                  <div className="flex items-center gap-2 min-w-0">
                    <BarChart3 size={16} className="text-cyan shrink-0" />
                    <h3 className="font-display text-[16px] font-semibold tracking-wider text-white truncate">{sec.title}</h3>
                  </div>
                  <motion.span
                    animate={{ rotate: isOpen ? 90 : 0 }}
                    transition={{ duration: 0.2 }}
                    className="shrink-0"
                  >
                    <ChevronRight size={17} className="text-[#7C93AC]" />
                  </motion.span>
                </button>
                <AnimatePresence initial={false}>
                  {isOpen && (
                    <motion.div
                      initial={{ height: 0, opacity: 0 }}
                      animate={{ height: 'auto', opacity: 1 }}
                      exit={{ height: 0, opacity: 0 }}
                      transition={{ duration: 0.25, ease: 'easeInOut' }}
                      className="overflow-hidden"
                    >
                      {sec.rows.length === 0 ? (
                        <div className="px-4 py-3 text-xs text-[#4A5A70] italic">No metrics recorded.</div>
                      ) : sec.rows.map((row, ri) => (
                        <div key={row.field + ri} className={`px-4 py-2.5 flex items-center justify-between text-sm ${ri % 2 === 1 ? 'bg-white/[0.02]' : ''}`}>
                          <span className="bg-gradient-to-r from-cyan to-mint bg-clip-text text-transparent drop-shadow-[0_0_8px_rgba(0,255,255,0.45)]"> {row.field}</span>
                          <span className="font-mono tabular font-semibold text-mint">{row.value}</span>
                        </div>
                      ))}
                    </motion.div>
                  )}
                </AnimatePresence>
              </GlassCard>
            </motion.div>
          );
        })
      )}
    </div>
  );
}

/* ============================================================
   4. ATTENDANCE SCREEN
   ============================================================ */
function AttendanceScreen({ data, loading, onSave, saving }) {
  const [draft, setDraft] = useState(null);
  const [division, setDivision] = useState('sales'); // 'sales' | 'marketing' — only two divisions, confirmed independently

  useEffect(() => {
    if (data) setDraft({ sales: data.salesOfficers, marketing: data.marketingOfficers });
  }, [data]);

  const groupList = draft ? draft[division] : [];
  const originalList = data ? (division === 'sales' ? data.salesOfficers : data.marketingOfficers) : [];

  const dirty = useMemo(() => {
    if (!draft || !data) return false;
    const a = groupList.map(p => p.status).join('');
    const b = originalList.map(p => p.status).join('');
    return a !== b;
  }, [groupList, originalList, draft, data]);

  const counts = useMemo(() => {
    const all = groupList || [];
    return { present: all.filter(p => p.status !== 'L').length, total: all.length };
  }, [groupList]);

  const toggle = (idx) => {
    setDraft(prev => ({ ...prev, [division]: prev[division].map((p, i) => i === idx ? { ...p, status: p.status === 'L' ? 'P' : 'L' } : p) }));
  };

  const reset = () => data && setDraft(prev => ({ ...prev, [division]: division === 'sales' ? data.salesOfficers : data.marketingOfficers }));

  if (loading || !draft) return <div className="px-4 py-4 max-w-2xl mx-auto"><SkeletonList rows={4} /></div>;

  const divisionLabel = division === 'sales' ? 'Sales Officers' : 'Marketing Officers';

  return (
    <div className="px-4 py-4 max-w-2xl mx-auto pb-24">
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2 text-[#7C93AC]">
          <Calendar size={14} />
          <span className="font-mono tabular text-xs">{data.date}</span>
        </div>
        <div className="font-mono tabular text-sm font-semibold text-mint">
          {counts.present}/{counts.total} <span className="text-[10px] font-display tracking-wider text-[#7C93AC]">PRESENT</span>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-2 mb-4">
        <FilterChip
          label={`Sales Officers (${draft.sales.length})`}
          active={division === 'sales'}
          onClick={() => setDivision('sales')}
        />
        <FilterChip
          label={`Marketing Officers (${draft.marketing.length})`}
          active={division === 'marketing'}
          onClick={() => setDivision('marketing')}
        />
      </div>

      <AnimatePresence mode="wait">
        <motion.div
          key={division}
          initial={{ opacity: 0, y: 6 }}
          animate={{ opacity: 1, y: 0 }}
          exit={{ opacity: 0, y: -6 }}
          transition={{ duration: 0.18, ease: 'easeOut' }}
        >
          <AttGroup title={divisionLabel} list={groupList} onToggle={toggle} />
        </motion.div>
      </AnimatePresence>

      <AnimatePresence>
        {dirty && (
          <motion.div
            key={division}
            initial={{ y: 80, opacity: 0 }}
            animate={{ y: 0, opacity: 1 }}
            exit={{ y: 80, opacity: 0 }}
            transition={{ type: 'spring', stiffness: 400, damping: 32 }}
            className="fixed left-0 right-0 z-40 bg-elevated/95 backdrop-blur-xl border-t border-cyan/25 px-4 py-3"
            style={{ bottom: 'calc(60px + env(safe-area-inset-bottom, 0px))' }}
          >
            <div className="max-w-2xl mx-auto flex items-center gap-3">
              <button onClick={reset} className="flex items-center gap-1.5 px-3 py-2.5 rounded-lg border border-[#8CAAC8]/20 text-[#7C93AC] text-xs font-medium hover:text-white transition-colors">
                <RotateCcw size={13} /> Reset
              </button>
              <button
                onClick={() => onSave(groupList)}
                disabled={saving}
                className="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg bg-gradient-to-r from-cyan to-mint text-canvas text-sm font-display font-semibold tracking-wide shadow-glow-cyan disabled:opacity-60"
              >
                <Save size={14} /> {saving ? 'SAVING...' : `SAVE ${divisionLabel.toUpperCase()}`}
              </button>
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

/* ============================================================
   APP ROOT
   ============================================================ */
function App() {
  const { apiUrl, updateApiUrl, mock, updateMock, callApi } = useApi();
  const [tab, setTab] = useState('hours');
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [refreshing, setRefreshing] = useState(false);
  const [lastSynced, setLastSynced] = useState('--:--:--');
  const [toast, setToast] = useState(null);
  const [diagnosis, setDiagnosis] = useState(null);
  const [diagnosing, setDiagnosing] = useState(false);

  const [hoursData, setHoursData] = useState([]);
  const [visitsData, setVisitsData] = useState([]);
  const [summaryData, setSummaryData] = useState([]);
  const [attData, setAttData] = useState(null);
  const [beatPlanData, setBeatPlanData] = useState([]);
  const [loading, setLoading] = useState({ hours: true, visits: true, summary: true, attendance: true, beatplan: true });
  const [saving, setSaving] = useState(false);
  const [dir, setDir] = useState(0); // tab transition direction: 1 = forward, -1 = backward
  const [booted, setBooted] = useState(false); // becomes true after the first successful/failed sync
  const hasBootedRef = useRef(false);

  const live = mock || !!apiUrl;

  const loadAll = useCallback(async () => {
    setRefreshing(true);
    setLoading({ hours: true, visits: true, summary: true, attendance: true, beatplan: true });
    try {
      const [h, v, s, a, b] = await Promise.all([
        callApi('getAdminWorkingHours'),
        callApi('getAdminVisitsCompleted'),
        callApi('getAdminVisitSummary'),
        callApi('getAdminAttendance'),
        callApi('getAdminBeatPlan'),
      ]);
      if (h.ok) setHoursData(h.rows || []);
      if (v.ok) setVisitsData(v.rows || []);
      if (s.ok) setSummaryData(s.sections || []);
      if (a.ok) setAttData({ date: a.date, salesOfficers: a.salesOfficers || [], marketingOfficers: a.marketingOfficers || [] });
      if (b.ok) setBeatPlanData(b.rows || []);
      setLastSynced(new Date().toLocaleTimeString('en-US', { hour12: false }));
    } catch (e) {
      setToast({ message: 'Sync failed — check connection settings.', tone: 'coral' });
    } finally {
      setLoading({ hours: false, visits: false, summary: false, attendance: false, beatplan: false });
      setTimeout(() => setRefreshing(false), 600);
      if (!hasBootedRef.current) {
        hasBootedRef.current = true;
        setBooted(true);
      }
    }
  }, [callApi]);

  useEffect(() => { loadAll(); }, [loadAll]);

  const handleSaveAttendance = async (records) => {
    setSaving(true);
    try {
      const res = await callApi('submitAdminAttendance', { records });
      if (res.ok) {
        // records may only cover one division (Sales OR Marketing, saved
        // independently) — merge status updates by userId/name into whichever
        // list they belong to, leaving the untouched division exactly as-is.
        setAttData(prev => {
          const applyUpdates = (list) => list.map(p => {
            const updated = records.find(r => (r.userId && r.userId === p.userId) || r.name === p.name);
            return updated ? { ...p, status: updated.status } : p;
          });
          return { ...prev, salesOfficers: applyUpdates(prev.salesOfficers), marketingOfficers: applyUpdates(prev.marketingOfficers) };
        });
        setToast({ message: 'Attendance saved successfully.', tone: 'mint' });
      } else {
        setToast({ message: res.message || 'Save failed.', tone: 'coral' });
      }
    } catch (e) {
      setToast({ message: 'Save failed — network error.', tone: 'coral' });
    } finally {
      setSaving(false);
    }
  };

  const handleDiagnose = async (url) => {
    setDiagnosing(true);
    setDiagnosis(null);
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getAdminWorkingHours', payload: {} }),
      });
      const json = await res.json();
      setDiagnosis(json.ok
        ? { ok: true, message: `Connected. ${(json.rows || []).length} row(s) returned.` }
        : { ok: false, message: `Reached backend, but: ${json.message || 'unknown error'}` });
    } catch (e) {
      setDiagnosis({ ok: false, message: 'Could not reach that URL (CORS, network, or deployment access issue).' });
    } finally {
      setDiagnosing(false);
    }
  };

  const attendanceMap = useMemo(() => {
    const map = {};
    if (attData) {
      [...(attData.salesOfficers || []), ...(attData.marketingOfficers || [])].forEach(p => { map[p.name] = p.status; });
    }
    return map;
  }, [attData]);

  // Marketing Officers should always show on the Hours tab, even before they've
  // started their day (no punch-in record yet in hoursData). Sales Officers keep
  // the original behaviour — they only appear once they have a hours record.
  const mergedHoursRows = useMemo(() => {
    if (!attData) return hoursData;
    const present = new Set(hoursData.map(r => r.name));
    const missingMO = (attData.marketingOfficers || [])
      .filter(mo => !present.has(mo.name))
      .map(mo => ({ name: mo.name, start: '--', end: '--', total: '--' }));
    return missingMO.length ? [...hoursData, ...missingMO] : hoursData;
  }, [hoursData, attData]);

  // Changes the active tab, recording which direction we moved in (based on
  // tab order) so the slide transition and swipe gesture agree on direction.
  const changeTab = useCallback((key) => {
    setTab(prev => {
      if (prev === key) return prev;
      const oldIdx = TAB_KEYS.indexOf(prev);
      const newIdx = TAB_KEYS.indexOf(key);
      setDir(newIdx > oldIdx ? 1 : -1);
      return key;
    });
  }, []);

  // Kept in sync every render so the swipe handler below always reads the
  // truly-current tab, even if a gesture spans a render caused by something
  // else (e.g. a data refresh) — avoids any stale-closure edge cases.
  const tabRef = useRef(tab);
  tabRef.current = tab;

  // Swipe left/right on the main content area to move to the next/previous
  // tab. Uses Framer Motion's own pan-gesture recognizer (onPanEnd) instead
  // of raw touchstart/touchend — it already tracks pointer/touch input
  // reliably everywhere else in this app, correctly ignores taps on nested
  // buttons/accordions until the finger actually moves, and isn't affected
  // by a child element re-rendering mid-gesture the way manual touch-event
  // refs could be.
  const handlePanEnd = useCallback((event, info) => {
    const dx = info.offset.x;
    const dy = info.offset.y;
    const SWIPE_THRESHOLD = 55;
    if (Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    const idx = TAB_KEYS.indexOf(tabRef.current);
    if (dx < 0 && idx < TAB_KEYS.length - 1) changeTab(TAB_KEYS[idx + 1]); // swipe left -> next tab
    else if (dx > 0 && idx > 0) changeTab(TAB_KEYS[idx - 1]); // swipe right -> previous tab
  }, [changeTab]);

  return (
    <AnimatePresence mode="wait">
      {!booted ? (
        <motion.div key="boot" exit={{ opacity: 0 }} transition={{ duration: 0.35, ease: 'easeOut' }}>
          <BootLoader />
        </motion.div>
      ) : (
        <motion.div
          key="app"
          className="min-h-screen bg-hud-radial"
          initial={{ opacity: 0 }}
          animate={{ opacity: 1 }}
          transition={{ duration: 0.4, ease: 'easeOut' }}
        >
          <TopBar live={live} lastSynced={lastSynced} onRefresh={loadAll} refreshing={refreshing} onOpenSettings={() => setSettingsOpen(true)} />

          <motion.main
            style={{ paddingBottom: 'calc(72px + env(safe-area-inset-bottom, 0px))', touchAction: 'pan-y' }}
            onPanEnd={handlePanEnd}
          >
            <div style={{ position: 'relative' }}>
              <AnimatePresence custom={dir} initial={false}>
                <motion.div
                  key={tab}
                  custom={dir}
                  initial={{ x: dir >= 0 ? 48 : -48, opacity: 0 }}
                  animate={{ x: 0, opacity: 1, position: 'relative', pointerEvents: 'auto' }}
                  exit={{ x: dir >= 0 ? -48 : 48, opacity: 0, position: 'absolute', top: 0, left: 0, right: 0, pointerEvents: 'none' }}
                  transition={{ duration: 0.2, ease: 'easeOut' }}
                  style={{ width: '100%' }}
                >
                  {tab === 'hours' && <WorkingHoursScreen rows={mergedHoursRows} loading={loading.hours} attendanceMap={attendanceMap} />}
                  {tab === 'visits' && <VisitsScreen rows={visitsData} loading={loading.visits} />}
                  {tab === 'summary' && <SummaryScreen sections={summaryData} loading={loading.summary} />}
                  {tab === 'attendance' && <AttendanceScreen data={attData} loading={loading.attendance} onSave={handleSaveAttendance} saving={saving} />}
                  {tab === 'beatplan' && <BeatPlanScreen rows={beatPlanData} loading={loading.beatplan} />}
                </motion.div>
              </AnimatePresence>
            </div>
          </motion.main>

          <BottomNav active={tab} onChange={changeTab} />

          <SettingsModal
            open={settingsOpen}
            onClose={() => setSettingsOpen(false)}
            apiUrl={apiUrl}
            onSaveUrl={updateApiUrl}
            mock={mock}
            onToggleMock={updateMock}
            onDiagnose={handleDiagnose}
            diagnosis={diagnosis}
            diagnosing={diagnosing}
          />

          <AnimatePresence>
            {toast && <Toast key={toast.message} message={toast.message} tone={toast.tone} onDone={() => setToast(null)} />}
          </AnimatePresence>
        </motion.div>
      )}
    </AnimatePresence>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .catch(err => console.warn('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
