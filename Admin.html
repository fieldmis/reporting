<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Ops Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050810;
      --bg-2:#080D1A;
      --grid-line: rgba(34,211,255,0.06);
      --grid-line-strong: rgba(34,211,255,0.11);
      --glass: rgba(13,20,36,0.55);
      --glass-soft: rgba(13,20,36,0.35);
      --glass-border: rgba(34,211,255,0.22);
      --glass-border-soft: rgba(140,170,200,0.14);

      --aqua:#22E5FF;
      --cyan:#22D3FF;
      --mint:#39FFC1;
      --violet:#A56BFF;

      --text:#DFF6FF;
      --text-soft:#7C93AC;
      --text-faint:#4A5A70;

      --font-display:'Orbitron','Rajdhani',sans-serif;
      --font-body:'Rajdhani','Segoe UI',sans-serif;
      --font-mono:'Share Tech Mono','IBM Plex Mono',monospace;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      background:
        radial-gradient(ellipse 900px 500px at 50% -10%, rgba(34,211,255,0.10), transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 100%, rgba(165,107,255,0.08), transparent 60%),
        var(--bg);
      color:var(--text);
      font-family:var(--font-body);
      font-size:16px;
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
    }
    /* fixed cyan grid overlay */
    body::before{
      content:'';
      position:fixed; inset:0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse 100% 70% at 50% 0%, #000 40%, transparent 85%);
      pointer-events:none;
      z-index:0;
    }
    .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
    .wrap{max-width:960px;margin:0 auto;padding:0 16px 70px;position:relative;z-index:1;}

    /* ---------- topbar ---------- */
    .topbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:20px 4px 16px;margin-bottom:16px;
      border-bottom:1px solid var(--glass-border);
    }
    .brand{display:flex;align-items:center;gap:12px;}
    .brand-mark{
      font-family:var(--font-display);font-size:12px;font-weight:800;
      color:var(--bg);background:linear-gradient(135deg,var(--cyan),var(--mint));
      padding:6px 10px;letter-spacing:1.5px;border-radius:6px;
      box-shadow:0 0 16px rgba(34,211,255,0.55), 0 0 2px rgba(255,255,255,0.4) inset;
    }
    .brand h1{
      font-family:var(--font-display);font-size:16px;margin:0;font-weight:700;
      letter-spacing:1px;text-transform:uppercase;
      background:linear-gradient(90deg,var(--text),var(--aqua) 120%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .status-dot{
      display:inline-block;width:7px;height:7px;border-radius:50%;
      background:var(--mint);box-shadow:0 0 8px var(--mint), 0 0 2px var(--mint);
      margin-right:6px;animation:pulse 2s ease-in-out infinite;
      vertical-align:middle;
    }
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
    .clock{font-family:var(--font-mono);font-size:13px;color:var(--aqua);text-align:right;letter-spacing:.5px;}
    .clock .date{display:block;font-size:10px;color:var(--text-soft);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}

    /* ---------- tabs ---------- */
    .tabs{
      display:flex;gap:6px;margin-bottom:20px;
      background:var(--glass-soft);border:1px solid var(--glass-border-soft);
      border-radius:12px;padding:5px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      overflow-x:auto;
    }
    .tab{
      flex:1;min-width:max-content;border:none;background:transparent;color:var(--text-soft);
      font-family:var(--font-display);font-size:10.5px;font-weight:700;padding:11px 10px;
      cursor:pointer;letter-spacing:1.2px;text-transform:uppercase;border-radius:8px;
      transition:color .2s, background .25s, box-shadow .25s;white-space:nowrap;
    }
    .tab.active{
      background:linear-gradient(135deg, rgba(34,211,255,0.20), rgba(165,107,255,0.20));
      color:var(--text);box-shadow:0 0 0 1px var(--glass-border) inset, 0 0 14px rgba(34,211,255,0.25);
    }
    .tab:not(.active):hover{color:var(--aqua);}

    .panel{display:none;}
    .panel.active{display:block;animation:fadeUp .35s ease both;}
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(10px);}
      to{opacity:1;transform:translateY(0);}
    }

    /* ---------- board head ---------- */
    .board-head{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:12px;
    }
    .board-head h2{
      font-family:var(--font-display);font-size:11.5px;text-transform:uppercase;letter-spacing:2px;
      color:var(--text);margin:0;font-weight:700;display:flex;align-items:center;
    }
    .board-head .meta{font-size:11px;color:var(--aqua);font-family:var(--font-mono);letter-spacing:.5px;}
    .refresh-btn{
      border:1px solid var(--glass-border);background:var(--glass-soft);color:var(--aqua);
      font-size:10px;font-family:var(--font-display);font-weight:700;letter-spacing:1px;text-transform:uppercase;
      padding:7px 12px;cursor:pointer;border-radius:8px;backdrop-filter:blur(10px);
      transition:box-shadow .2s, border-color .2s, transform .15s;
    }
    .refresh-btn:hover{border-color:var(--cyan);box-shadow:0 0 12px rgba(34,211,255,0.35);transform:translateY(-1px);}
    .refresh-btn:active{transform:translateY(0);}

    /* ---------- glass panel base (tables + summary cards) ---------- */
    table.board{
      width:100%;border-collapse:collapse;background:var(--glass);
      border:1px solid var(--glass-border-soft);border-radius:14px;overflow:hidden;
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      box-shadow:0 8px 30px rgba(0,0,0,0.45);
    }
    table.board th{
      text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;
      color:var(--aqua);font-weight:700;padding:12px 14px;font-family:var(--font-display);
      border-bottom:1px solid var(--glass-border);background:rgba(34,211,255,0.05);
    }
    table.board td{
      padding:12px 14px;border-bottom:1px solid rgba(140,170,200,0.08);font-size:14px;
      color:var(--text);transition:background .15s;
    }
    table.board tbody tr:hover td{background:rgba(34,211,255,0.045);}
    table.board tr:last-child td{border-bottom:none;}
    table.board td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text);}
    .below-avg{color:var(--violet);font-weight:700;text-shadow:0 0 10px rgba(165,107,255,0.5);}
    .empty-row td{color:var(--text-faint);font-style:italic;padding:20px 14px;text-align:center;}

    .summary-section{
      margin-bottom:14px;background:var(--glass);border:1px solid var(--glass-border-soft);
      border-radius:14px;overflow:hidden;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      box-shadow:0 8px 30px rgba(0,0,0,0.4);
    }
    .summary-section h3{
      font-family:var(--font-display);font-size:10.5px;text-transform:uppercase;letter-spacing:1.8px;margin:0;
      padding:11px 14px;background:rgba(165,107,255,0.08);border-bottom:1px solid var(--glass-border);
      color:var(--violet);font-weight:700;border-left:3px solid var(--violet);
    }
    .summary-section table{width:100%;border-collapse:collapse;}
    .summary-section td{padding:9px 14px;border-bottom:1px solid rgba(140,170,200,0.08);font-size:13.5px;color:var(--text-soft);}
    .summary-section tr:last-child td{border-bottom:none;}
    .summary-section td.val{font-family:var(--font-mono);text-align:right;font-weight:700;color:var(--mint);text-shadow:0 0 8px rgba(57,255,193,0.35);}

    /* ---------- attendance ---------- */
    .att-group{margin-bottom:22px;}
    .att-group h3{
      font-family:var(--font-display);font-size:10.5px;text-transform:uppercase;letter-spacing:1.8px;
      color:var(--aqua);margin:0 0 10px;font-weight:700;
    }
    .att-row{
      display:flex;align-items:center;justify-content:space-between;
      background:var(--glass);border:1px solid var(--glass-border-soft);
      border-radius:12px;padding:13px 16px;margin-bottom:8px;
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      transition:border-color .2s;
    }
    .att-row:hover{border-color:var(--glass-border);}
    .att-name{font-size:14px;color:var(--text);letter-spacing:.2px;}
    .toggle{
      display:flex;border:1px solid var(--glass-border-soft);border-radius:8px;overflow:hidden;cursor:pointer;
      font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:1px;
      background:var(--glass-soft);
    }
    .toggle span{padding:7px 15px;color:var(--text-faint);transition:background .2s, color .2s, box-shadow .2s;}
    .toggle.present span.p{background:linear-gradient(135deg,var(--mint),#1FD8A0);color:#04140F;box-shadow:0 0 14px rgba(57,255,193,0.45) inset;}
    .toggle.leave span.l{background:linear-gradient(135deg,var(--violet),#7A3DFF);color:#150A2E;box-shadow:0 0 14px rgba(165,107,255,0.45) inset;}

    .submit-bar{display:flex;justify-content:flex-end;margin-top:10px;}
    .submit-btn{
      background:linear-gradient(135deg,var(--cyan),var(--mint));color:#031018;border:none;
      font-family:var(--font-display);font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
      padding:13px 26px;cursor:pointer;border-radius:10px;
      box-shadow:0 0 24px rgba(34,211,255,0.4), 0 6px 20px rgba(0,0,0,0.4);
      transition:transform .15s, box-shadow .2s;
    }
    .submit-btn:hover{transform:translateY(-2px);box-shadow:0 0 32px rgba(34,211,255,0.55), 0 8px 24px rgba(0,0,0,0.45);}
    .submit-btn:active{transform:translateY(0);}
    .submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none;}

    #toast{
      position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
      background:var(--glass);border:1px solid var(--glass-border);color:var(--text);
      padding:11px 20px;font-size:13px;border-radius:10px;
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      box-shadow:0 0 20px rgba(34,211,255,0.25), 0 8px 24px rgba(0,0,0,0.5);
      opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;z-index:10;
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @media (max-width:480px){
      .brand h1{font-size:13px;}
      .board-head h2{font-size:10px;}
      table.board th, table.board td{padding:10px 8px;font-size:12.5px;}
      .tab{font-size:9.5px;padding:10px 8px;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">FOS</span>
        <h1><span class="status-dot"></span>Field Ops Console</h1>
      </div>
      <div class="clock">
        <span id="clockTime">--:--:--</span>
        <span class="date" id="clockDate">-</span>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-panel="hours">Working Hours</button>
      <button class="tab" data-panel="visits">Visits</button>
      <button class="tab" data-panel="summary">Visit Summary</button>
      <button class="tab" data-panel="attendance">Attendance</button>
    </nav>

    <main>
      <!-- 1. TEAM WORKING HOURS -->
      <section class="panel active" id="panel-hours">
        <div class="board-head">
          <h2>Team Working Hours</h2>
          <button class="refresh-btn" onclick="loadHours()">Refresh</button>
        </div>
        <table class="board">
          <thead><tr><th>Name</th><th>Start</th><th>End</th><th>Total</th></tr></thead>
          <tbody id="hoursBody"><tr class="empty-row"><td colspan="4">Loading…</td></tr></tbody>
        </table>
      </section>

      <!-- 2. VISITS COMPLETED -->
      <section class="panel" id="panel-visits">
        <div class="board-head">
          <h2>Visits Completed</h2>
          <button class="refresh-btn" onclick="loadVisits()">Refresh</button>
        </div>
        <table class="board">
          <thead><tr><th>Name</th><th>Today</th><th>Avg</th></tr></thead>
          <tbody id="visitsBody"><tr class="empty-row"><td colspan="3">Loading…</td></tr></tbody>
        </table>
      </section>

      <!-- 3. TEAM VISITS SUMMARY -->
      <section class="panel" id="panel-summary">
        <div class="board-head">
          <h2>Team Visits Summary</h2>
          <button class="refresh-btn" onclick="loadSummary()">Refresh</button>
        </div>
        <div id="summaryBody">Loading…</div>
      </section>

      <!-- 4. TEAM ATTENDANCE -->
      <section class="panel" id="panel-attendance">
        <div class="board-head">
          <h2>Team Attendance</h2>
          <span class="meta" id="attDate">-</span>
        </div>
        <div class="att-group">
          <h3>Sales Officers</h3>
          <div id="soList"></div>
        </div>
        <div class="att-group">
          <h3>Marketing Officers</h3>
          <div id="moList"></div>
        </div>
        <div class="submit-bar">
          <button class="submit-btn" id="submitBtn" onclick="submitAttendance()">Confirm marking</button>
        </div>
      </section>
    </main>
  </div>

  <div id="toast"></div>

  <script>
    // ---------- API ----------
    // Same deployed Web App URL your index.html already calls.
    var CONFIG = {
      API_URL: 'https://script.google.com/macros/s/AKfycbyjIoOr0-s-QL-5tFa65mdNu6L12CHyTDVPV8NwYXMOkoVqGLS81LiL_3burFOHsfO3/exec'
    };

    function callApi(action, payload){
      return fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight against Apps Script
        body: JSON.stringify({ action: action, payload: payload || {} })
      }).then(function(r){ return r.json(); });
    }

    // ---------- tab switching ----------
    document.getElementById('tabs').addEventListener('click', function(e){
      var btn = e.target.closest('.tab');
      if(!btn) return;
      document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
      document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
    });

    // ---------- clock ----------
    function tickClock(){
      var now = new Date();
      document.getElementById('clockTime').textContent = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
      document.getElementById('clockDate').textContent = now.toLocaleDateString('en-US',{weekday:'short',day:'2-digit',month:'short'});
    }
    tickClock();
    setInterval(tickClock, 1000);

    function toast(msg){
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function(){t.classList.remove('show');}, 2500);
    }

    // ---------- 1. Working hours ----------
    function loadHours(){
      var body = document.getElementById('hoursBody');
      body.innerHTML = '<tr class="empty-row"><td colspan="4">Loading…</td></tr>';
      callApi('getAdminWorkingHours').then(function(res){
        if(!res.ok){ body.innerHTML = errRow(4, res.message); return; }
        var rows = res.rows || [];
        if(!rows.length){ body.innerHTML = '<tr class="empty-row"><td colspan="4">No log entries yet today.</td></tr>'; return; }
        body.innerHTML = rows.map(function(r){
          return '<tr><td>'+esc(r.name)+'</td><td class="num">'+esc(r.start)+'</td><td class="num">'+esc(r.end)+'</td><td class="num">'+esc(r.total)+'</td></tr>';
        }).join('');
      }).catch(function(err){ body.innerHTML = errRow(4, err.message || err); });
    }

    // ---------- 2. Visits completed ----------
    function loadVisits(){
      var body = document.getElementById('visitsBody');
      body.innerHTML = '<tr class="empty-row"><td colspan="3">Loading…</td></tr>';
      callApi('getAdminVisitsCompleted').then(function(res){
        if(!res.ok){ body.innerHTML = errRow(3, res.message); return; }
        var rows = res.rows || [];
        if(!rows.length){ body.innerHTML = '<tr class="empty-row"><td colspan="3">No visit data found.</td></tr>'; return; }
        body.innerHTML = rows.map(function(r){
          var belowCls = (Number(r.today) < Number(r.avg)) ? ' class="num below-avg"' : ' class="num"';
          return '<tr><td>'+esc(r.name)+'</td><td'+belowCls+'>'+esc(r.today)+'</td><td class="num">'+esc(r.avg)+'</td></tr>';
        }).join('');
      }).catch(function(err){ body.innerHTML = errRow(3, err.message || err); });
    }

    // ---------- 3. Team visits summary ----------
    function loadSummary(){
      var container = document.getElementById('summaryBody');
      container.innerHTML = 'Loading…';
      callApi('getAdminVisitSummary').then(function(res){
        if(!res.ok){ container.innerHTML = '<p style="color:var(--leave);">'+esc(res.message)+'</p>'; return; }
        var sections = res.sections || [];
        if(!sections.length){ container.innerHTML = '<p style="color:var(--ink-soft);font-style:italic;">No summary data found.</p>'; return; }
        container.innerHTML = sections.map(function(sec){
          if(!sec.rows || !sec.rows.length) return '';
          var rowsHtml = sec.rows.map(function(r){
            return '<tr><td>'+esc(r.field)+'</td><td class="val">'+esc(r.value)+'</td></tr>';
          }).join('');
          return '<div class="summary-section"><h3>'+esc(sec.title)+'</h3><table>'+rowsHtml+'</table></div>';
        }).join('');
      }).catch(function(err){ container.innerHTML = '<p style="color:var(--leave);">'+esc(err.message||err)+'</p>'; });
    }

    // ---------- 4. Attendance ----------
    var attendanceState = { sales: [], marketing: [] };

    function loadAttendance(){
      document.getElementById('soList').innerHTML = 'Loading…';
      document.getElementById('moList').innerHTML = 'Loading…';
      callApi('getAdminAttendance').then(function(res){
        if(!res.ok){
          document.getElementById('soList').innerHTML = '<p style="color:var(--leave);">'+esc(res.message)+'</p>';
          document.getElementById('moList').innerHTML = '';
          return;
        }
        document.getElementById('attDate').textContent = res.date || '';
        attendanceState.sales = res.salesOfficers || [];
        attendanceState.marketing = res.marketingOfficers || [];
        renderAttGroup('soList', attendanceState.sales);
        renderAttGroup('moList', attendanceState.marketing);
      }).catch(function(err){
        document.getElementById('soList').innerHTML = '<p style="color:var(--leave);">'+esc(err.message||err)+'</p>';
        document.getElementById('moList').innerHTML = '';
      });
    }

    function renderAttGroup(elId, list){
      var el = document.getElementById(elId);
      if(!list.length){ el.innerHTML = '<p style="color:var(--ink-soft);font-style:italic;padding:10px 0;">No one listed.</p>'; return; }
      el.innerHTML = list.map(function(p, idx){
        var present = p.status !== 'L';
        return '<div class="att-row">'+
          '<span class="att-name">'+esc(p.name)+'</span>'+
          '<div class="toggle '+(present?'present':'leave')+'" data-el="'+elId+'" data-idx="'+idx+'" onclick="toggleStatus(this)">'+
            '<span class="l">L</span><span class="p">P</span>'+
          '</div>'+
        '</div>';
      }).join('');
    }

    function toggleStatus(el){
      var listKey = (el.dataset.el === 'soList') ? 'sales' : 'marketing';
      var idx = Number(el.dataset.idx);
      var rec = attendanceState[listKey][idx];
      rec.status = (rec.status === 'L') ? 'P' : 'L';
      el.classList.toggle('present', rec.status !== 'L');
      el.classList.toggle('leave', rec.status === 'L');
    }

    function submitAttendance(){
      var records = [];
      attendanceState.sales.forEach(function(p){ records.push({userId:p.userId, name:p.name, status:p.status || 'P'}); });
      attendanceState.marketing.forEach(function(p){ records.push({userId:p.userId, name:p.name, status:p.status || 'P'}); });

      var btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      callApi('submitAdminAttendance', { records: records }).then(function(res){
        btn.disabled = false; btn.textContent = 'Confirm marking';
        if(res.ok) toast('Attendance saved.');
        else toast('Save failed: ' + (res.message || 'Unknown error'));
      }).catch(function(err){
        btn.disabled = false; btn.textContent = 'Confirm marking';
        toast('Save failed: ' + (err.message || err));
      });
    }

    // ---------- helpers ----------
    function esc(v){
      return String(v==null?'':v).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }
    function errRow(colspan, message){
      return '<tr class="empty-row"><td colspan="'+colspan+'" style="color:var(--leave);">'+esc(message || 'Something went wrong.')+'</td></tr>';
    }

    // ---------- initial load ----------
    loadHours();
    loadVisits();
    loadSummary();
    loadAttendance();
    // light auto-refresh for a live monitoring feel
    setInterval(function(){
      loadHours(); loadVisits();
    }, 60000);
  </script>
</body>
</html>
